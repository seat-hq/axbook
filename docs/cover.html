<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Inter:wght@500;600;700&display=swap" />
<style>
  html, body { margin: 0; width: 2000px; height: 800px; background: #10141c; color: #eef2f8; }
  body {
    display: flex;
    align-items: center;
    gap: 88px;
    padding: 0 108px 0 96px;
    box-sizing: border-box;
    background-image:
      linear-gradient(rgba(91, 140, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91, 140, 255, 0.07) 1px, transparent 1px);
    background-size: 80px 80px;
    font-family: Inter, system-ui, sans-serif;
  }
  .mark { width: 300px; height: 300px; flex: none; }
  .copy { flex: 1; }
  .eyebrow {
    margin: 0 0 20px;
    color: #5b8cff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    font-family: Fraunces, Georgia, serif;
    font-weight: 560;
    font-size: 92px;
    line-height: 0.96;
    letter-spacing: -0.035em;
  }
  p {
    margin: 28px 0 0;
    max-width: 1180px;
    color: #c5d0e0;
    font-size: 32px;
    line-height: 1.4;
  }
  .meta {
    display: flex;
    gap: 18px;
    margin-top: 40px;
  }
  .meta span {
    border: 1px solid #2a3344;
    background: #171c28;
    color: #8eabff;
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="49" fill="#10141c"/>
    <circle cx="50" cy="50" r="44" fill="none" stroke="#5b8cff" stroke-width="3.2"/>
    <g fill="#eef2f8">
      <polygon points="18,44 46,34 46,66 18,76"/>
      <polygon points="54,34 82,44 82,76 54,66"/>
    </g>
  </svg>
  <div class="copy">
    <p class="eyebrow">Axbook</p>
    <h1>Copy desks for<br>Stock Tokens.</h1>
    <p>A leader trades from their own wallet. Depositors hold a separate USDG vault. The fill is what crosses.</p>
    <div class="meta">
      <span>Robinhood Chain</span>
      <span>USDG</span>
      <span>axbook.xyz</span>
    </div>
  </div>
</body>
</html>
